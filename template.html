<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Judul Berita Kaboom</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="header-footer.css" />
</head>
<body>

    <section class="hero-section">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="sub">#Tagline</span>
                    <span class="main">Judul Berita Utama</span>
                </h1>
            </div>
            <div class="hero-image">
                <img src="#.png" alt="Judul Berita" />
            </div>
        </div>
    </section>

    <section class="article-content">
        <div class="container">
            <div class="article-body">

                <p>Isi berita paragraf pertama.</p>

                <p>Isi berita paragraf kedua.</p>

                <div class="slider-container" id="slider">
                    <div class="slider-wrapper" id="sliderWrapper">
                        <img src="#.png" alt="Foto 1" />
                        <img src="#.png" alt="Foto 2" />
                    </div>
                    <button class="slider-btn prev" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                    <button class="slider-btn next" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
                    <div class="slider-dots" id="dotsContainer"></div>
                </div>
                <div class="slider-caption">
                    <span>Sumber: ...</span>
                </div>

                <h2>Sub Judul</h2>

                <p>Isi berita selanjutnya.</p>

                <div class="sumber">
                    <p class="sumber-judul">Daftar Pustaka</p>
                    <p class="sumber-item">Sumber 1.</p>
                    <p class="sumber-item">Sumber 2.</p>
                </div>

            </div>
        </div>
    </section>

    <script src="header-footer.js"></script>
    <script src="slider.js"></script>

</body>
</html>
